name: Database Deploy

on:
  push:
    branches:
      - main
      - production
    paths:
      - 'prisma/**'
      - '.env.example'

jobs:
  db-deploy:
    name: Database Migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Generate
        run: npx prisma generate
